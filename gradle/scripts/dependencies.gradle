repositories {
    maven { name = 'ChickenBones'; url = 'https://chickenbones.net/maven/' }
    maven { name = 'ProjectRed'; url = 'https://files.projectredwiki.com/maven' }
    maven { name = 'DVS1'; url = 'https://dvs1.progwml6.com/files/maven/' }
    maven { name = 'Outlands'; url = 'https://maven.outlands.top/releases' }
    maven { name = 'CleanroomMC'; url = 'https://repo.cleanroommc.com/releases' }
    maven { name = 'Cleanroom'; url = 'https://maven.cleanroommc.com' }
    maven { name = 'CurseMaven'; url = 'https://cursemaven.com' }
    mavenCentral()
    mavenLocal()
}

dependencies {
    if (enable_lwjglx.toBoolean()) {
        compileOnly 'com.cleanroommc:lwjglx:1.0.0'
    }

    // Scalar is a Cleanroom coremod/provider and is deliberately not part of mod metadata.
    modRuntimeOnly 'com.cleanroommc:scalar:1.0.0'

    // Scala 3 / Cleanroom-compatible variants from the working-tree migration diff.
    modImplementation "mrtjp:MrTJPCore:${tjpcore_version}"
    modImplementation("codechicken:forgemultipartcbe:${fmp_version}") {
        // The Cleanroom artifact declares Scalar through a remapped Maven coordinate.
        // Scalar is supplied separately as a provider and must not be resolved transitively here.
        transitive = false
    }
    modImplementation "mezz:jei:${jei_version}"

    modImplementation "codechicken:ChickenASM:${chickenasm_version}"
    modImplementation "codechicken:CodeChickenLib:${ccl_version}"
}
