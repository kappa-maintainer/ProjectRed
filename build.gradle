plugins {
    id 'java'
    id 'scala'
    id 'java-library'
    id 'maven-publish'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id 'xyz.wagyourtail.unimined' version '1.4.27-kappa'
    id 'net.kyori.blossom' version '2.2.0'
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import org.gradle.api.tasks.scala.ScalaCompile
import org.gradle.jvm.tasks.Jar

version = mod_version
group = root_package

base {
    archivesName = mod_archive_name
}

scala {
    scalaVersion = '3.8.4'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version.toInteger())
    }
    if (generate_sources_jar.toBoolean()) {
        withSourcesJar()
    }
    if (generate_javadocs_jar.toBoolean()) {
        withJavadocJar()
    }
}

configurations {
    contain
    implementation.extendsFrom(contain)
    modCompileOnly
    compileOnly.extendsFrom(modCompileOnly)
    modRuntimeOnly
    runtimeOnly.extendsFrom(modRuntimeOnly)
}

//noinspection GroovyAssignabilityCheck
unimined.minecraft {
    version minecraft_version

    mappings {
        mcp(mappings_channel, mappings_version)
    }

    cleanroom {
        if (use_access_transformer.toBoolean()) {
            accessTransformer "${projectDir}/src/main/resources/projectred-relocation_at.cfg"
        }
        loader cleanroom_loader
        runs.all {
            args += ['--username', minecraft_username]
            if (extra_jvm_args != null && !extra_jvm_args.trim().isEmpty()) {
                jvmArgs += extra_jvm_args.split(/\s+/).toList()
            }
            if (enable_foundation_debug.toBoolean()) {
                systemProperty('foundation.dump', 'true')
                systemProperty('foundation.verbose', 'true')
            }
        }
    }

    defaultRemapJar = false
    remap(tasks.named('jar').get())
    mods {
        remap(configurations.modCompileOnly)
        remap(configurations.modRuntimeOnly)
    }
}

apply from: 'gradle/scripts/dependencies.gradle'

sourceSets {
    main {
        scala {
            srcDir 'src/main/scala'
        }
        java {
            srcDir 'src/main/java'
        }
        resources {
            srcDir 'src/main/resources'
        }
        blossom {
            scalaSources {
                property('mod_version', mod_version)
                property('mod_id', mod_id)
                property('mod_name', mod_name)
                property('package', "${root_package}.projectred")
                property('tjpcore_version', tjpcore_version)
                property('ccl_version', ccl_version)
                property('fmp_version', fmp_version)
                property('jei_version', jei_version)
                property('scala_version', scala_version)
                property('minecraft_version', minecraft_version)
            }
            resources {
                property('mod_version', mod_version)
                property('mc_version', minecraft_version)
                property('forge_version', '14.23.5.2864')
                property('tjcore_version', tjpcore_version)
                property('ccl_version', ccl_version)
                property('fmp_version', fmp_version)
                property('mod_id', mod_id)
                property('mod_name', mod_name)
                property('mod_description', mod_description)
                property('mod_authors', mod_authors.split(',').findAll { !it.isBlank() }.collect { "\"${it.trim()}\"" }.join(', '))
                property('mod_credits', mod_credits)
                property('mod_url', mod_url)
                property('mod_update_json', mod_update_json)
                property('mod_logo_path', mod_logo_path)
            }
        }
    }
}

// Blossom generates one metadata file per logical mod. Forge's 1.12 loader scans a
// single mcmod.info, so merge those generated arrays before resources are consumed by
// classes, jars, and the development run.
def blossomResourceDir = layout.buildDirectory.dir('generated/resources/blossom/main/resource').get().asFile
def mergedModInfoFile = layout.buildDirectory.file('generated/resources/projectred/main/mcmod.info').get().asFile
def mergeModInfo = tasks.register('mergeModInfo') {
    dependsOn tasks.named('generateResourceTemplates')
    inputs.files(fileTree(blossomResourceDir) {
        include '*_mod.info'
    })
    outputs.file(mergedModInfoFile)
    doLast {
        def sourceFiles = fileTree(blossomResourceDir) {
            include '*_mod.info'
        }.files.sort { a, b -> a.name <=> b.name }
        if (sourceFiles.empty) {
            throw new GradleException("No generated *_mod.info files found in ${blossomResourceDir}")
        }

        def mods = sourceFiles.collectMany { sourceFile ->
            def parsed = new JsonSlurper().parse(sourceFile)
            if (!(parsed instanceof List)) {
                throw new GradleException("${sourceFile} must contain a JSON array")
            }
            parsed
        }
        mergedModInfoFile.parentFile.mkdirs()
        mergedModInfoFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(mods)) + System.lineSeparator()
    }
}

processResources {
    dependsOn mergeModInfo
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // The development directory and combined artifacts expose one mcmod.info.
    // Split jars read their individual generated metadata explicitly below.
    exclude '**/*_mod.info'
    from(mergeModInfo) {
        into ''
    }
    rename '(.+_at.cfg)', 'META-INF/$1'
}

tasks.named('sourcesJar', Jar) {
    dependsOn mergeModInfo
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude '**/*_mod.info'
    from(mergeModInfo) {
        into ''
    }
}

compileJava {
    options.release = java_version.toInteger()
    options.encoding = 'UTF-8'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ScalaCompile).configureEach {
    options.encoding = 'UTF-8'
    scalaCompileOptions.additionalParameters = [
            '-release:25',
            //'-Ytasty-reader', 
            //'-nowarn', 
            //'-source:future-migration',
            //'-indent',
            //'-rewrite'
    ]
    //scalaCompileOptions.force = true
}

jar {
    archiveClassifier = 'deobf'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes('ModType': 'CRL')
        if (use_access_transformer.toBoolean()) {
            attributes('FMLAT': 'projectred-relocation_at.cfg')
        }
    }
}

// Keep the historical module split jars. They are assembled from the remapped universal jar.
def moduleJar = { String taskName, String classifierName, String metadataName, Closure spec ->
    tasks.register(taskName, Jar) {
        dependsOn tasks.named('remapJar'), mergeModInfo
        archiveClassifier = classifierName
        includeEmptyDirs = false
        from(zipTree(tasks.named('remapJar').get().archiveFile)) {
            // The remapped jar contains the combined metadata for universal/deobf.
            // A historical split jar must instead expose only its own mod entry.
            exclude 'mcmod.info'
            exclude '**/*_mod.info'
            spec.delegate = delegate
            spec()
        }
        from(blossomResourceDir) {
            include metadataName
            rename metadataName, 'mcmod.info'
        }
    }
}

def moduleExcludes = []
def addModuleIncludes = { Collection patterns -> moduleExcludes.addAll(patterns) }

def integrationPatterns = [
        '**/ProjectRedIntegration*.class', '**/ProjectRedTransmission*.class',
        '**/mrtjp/projectred/integration/**', '**/mrtjp/projectred/transmission/**',
        '**/assets/projectred/textures/blocks/integration/**', '**/assets/projectred/textures/obj/integration/**',
        '**/assets/projectred-integration/recipes/**', '**/assets/projectred-transmission/recipes/**'
]
def fabricationPatterns = [
        '**/ProjectRedFabrication*.class', '**/mrtjp/projectred/fabrication/**',
        '**/assets/projectred/cc_blockstates/fabrication/**', '**/assets/projectred/textures/blocks/fabrication/**',
        '**/assets/projectred/textures/items/fabrication/**', '**/assets/projectred/textures/obj/fabrication/**',
        '**/assets/projectred-fabrication/recipes/**'
]
def lightingPatterns = [
        '**/ProjectRedIllumination*.class', '**/mrtjp/projectred/illumination/**',
        '**/assets/projectred/textures/blocks/lighting/**', '**/assets/projectred/textures/items/lighting/**',
        '**/assets/projectred/textures/obj/lighting/**', '**/assets/projectred-illumination/recipes/**'
]
def mechanicalPatterns = [
        '**/ProjectRedExpansion*.class', '**/mrtjp/projectred/expansion/**',
        '**/ProjectRedTransportation*.class', '**/mrtjp/projectred/transportation/**',
        '**/ProjectRedRelocation*.class', '**/mrtjp/projectred/relocation/**',
        '**/assets/projectred/cc_blockstates/mechanical/**', '**/assets/projectred/textures/blocks/mechanical/**',
        '**/assets/projectred/textures/items/mechanical/**', '**/assets/projectred/textures/obj/mechanical/**',
        '**/assets/projectred-expansion/recipes/**', '**/assets/projectred-transportation/recipes/**',
        '**/assets/projectred-relocation/recipes/**', '**/projectred-relocation_at.cfg'
]
def worldPatterns = [
        '**/ProjectRedExploration*.class', '**/mrtjp/projectred/exploration/**',
        '**/assets/projectred/cc_blockstates/world/**', '**/assets/projectred/textures/blocks/world/**',
        '**/assets/projectred/textures/items/world/**', '**/assets/projectred/textures/obj/world/**',
        '**/assets/projectred-exploration/recipes/**'
]
def compatPatterns = [
        '**/ProjectRedCompatibility*.class', '**/mrtjp/projectred/compatibility/**',
        '**/assets/projectred/textures/blocks/compat/**'
]

def integrationJar = moduleJar('integrationJar', 'integration', 'integration_mod.info') { include integrationPatterns }
def fabricationJar = moduleJar('fabricationJar', 'fabrication', 'fabrication_mod.info') { include fabricationPatterns }
def lightingJar = moduleJar('lightingJar', 'lighting', 'lighting_mod.info') { include lightingPatterns }
def mechanicalJar = moduleJar('mechanicalJar', 'mechanical', 'mechanical_mod.info') { include mechanicalPatterns }
mechanicalJar.configure { manifest { attributes('FMLAT': 'projectred-relocation_at.cfg') } }
def worldJar = moduleJar('worldJar', 'world', 'world_mod.info') { include worldPatterns }
def compatJar = moduleJar('compatJar', 'compat', 'compat_mod.info') { include compatPatterns }
def splitJarTasks = [integrationJar, fabricationJar, lightingJar, mechanicalJar, worldJar, compatJar]

def baseJar = tasks.register('baseJar', Jar) {
    dependsOn tasks.named('remapJar'), splitJarTasks
    mustRunAfter splitJarTasks
    archiveClassifier = 'Base'
    includeEmptyDirs = false
    from(zipTree(tasks.named('remapJar').get().archiveFile)) {
        exclude integrationPatterns + fabricationPatterns + lightingPatterns + mechanicalPatterns + worldPatterns + compatPatterns
        exclude 'mcmod.info'
        exclude '**/*_mod.info'
    }
    from(blossomResourceDir) {
        include 'base_mod.info'
        rename 'base_mod.info', 'mcmod.info'
    }
}

// The split jars and the development/remapped artifacts are all first-class outputs.
tasks.named('remapJar').configure {
    doFirst {
        logging.captureStandardOutput LogLevel.INFO
    }
    doLast {
        logging.captureStandardOutput LogLevel.QUIET
    }
    archiveClassifier = 'universal'
}

tasks.named('assemble').configure {
    dependsOn splitJarTasks + baseJar
}

artifacts {
    archives integrationJar
    archives fabricationJar
    archives lightingJar
    archives mechanicalJar
    archives worldJar
    archives compatJar
    archives baseJar
}

apply from: 'gradle/scripts/publishing.gradle'
apply from: 'gradle/scripts/extra.gradle'
